services:
  siv-db:
    image: postgres:16-alpine
    container_name: SIV_Postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: SIV_DB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    volumes:
      - siv_postgres_data:/var/lib/postgresql/data

  siv-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: SIV_API
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=siv-db;Port=5432;Database=SIV_DB;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres123};
    depends_on:
      - siv-db

volumes:
  siv_postgres_data:

