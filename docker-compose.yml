version: "3.8"

services:
  siv-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: SIV_SQL_Server
    user: "0"
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_PASSWORD}
    volumes:
      - siv_db_data:/var/opt/mssql/data

volumes:
  siv_db_data:
